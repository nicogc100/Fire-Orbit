# Integración continua: en cada push y pull request se revisa formato, estilo,
# versiones de caché y pruebas. Si algo falla, GitHub lo marca en rojo.
name: Verificación

on:
  push:
    branches: [master]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
